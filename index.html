
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasarela de Pago Segura - ICPNA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .checkout-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            text-align: center;
        }
        .header {
            margin-bottom: 25px;
        }
        .header h1 {
            color: #002060; /* Azul ICPNA */
            margin: 0;
            font-size: 24px;
        }
        .header p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        .amount-display {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }
        .amount-display span {
            display: block;
            color: #666;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .amount-display h2 {
            margin: 10px 0 0;
            color: #333;
            font-size: 32px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 13px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-pay {
            background-color: #e3000f; /* Rojo ICPNA */
            color: white;
            border: none;
            border-radius: 6px;
            padding: 15px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .btn-pay:hover {
            background-color: #b3000c;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
        
        /* Modal de confirmación */
        #success-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 300px;
        }
        .success-icon {
            color: #28a745;
            font-size: 48px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="checkout-container">
    <div class="header">
        <h1>ICPNA</h1>
        <p>Renovación de Matrícula "One-Click"</p>
    </div>
    
    <div class="amount-display">
        <span>Total a Pagar</span>
        <h2>S/ 305.00</h2>
    </div>
    
    <div class="form-group">
        <label>Número de Tarjeta (Simulado)</label>
        <input type="text" placeholder="**** **** **** 1234" value="4555 6666 7777 8888">
    </div>
    
    <div class="form-group" style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <label>Vencimiento</label>
            <input type="text" placeholder="MM/YY" value="12/28">
        </div>
        <div style="flex: 1;">
            <label>CVV</label>
            <input type="password" placeholder="***" value="123">
        </div>
    </div>
    
    <button class="btn-pay" onclick="simulatePayment()">Pagar S/ 305.00</button>
    
    <div class="footer">
        🔒 Simulación segura procesada por la plataforma de pruebas.
    </div>
</div>

<div id="success-modal">
    <div class="modal-content">
        <div class="success-icon">✅</div>
        <h3 style="margin-top:0; color:#333;">¡Pago Exitoso!</h3>
        <p style="color:#666; font-size:14px;">Tu vacante ha sido reservada automáticamente. Recibirás tu boleta por correo.</p>
        <button class="btn-pay" style="background-color: #002060;" onclick="closeModal()">Volver al portal</button>
    </div>
</div>

<script>
    function simulatePayment() {
        const btn = document.querySelector('.btn-pay');
        btn.innerHTML = 'Procesando...';
        btn.style.opacity = '0.7';
        
        setTimeout(() => {
            document.getElementById('success-modal').style.display = 'flex';
            btn.innerHTML = 'Pagar S/ 290.00';
            btn.style.opacity = '1';
        }, 1500);
    }
    
    function closeModal() {
        document.getElementById('success-modal').style.display = 'none';
    }
</script>

</body>
</html>
